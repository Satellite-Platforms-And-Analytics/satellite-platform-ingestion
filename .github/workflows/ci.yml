# .github/workflows/ci.yml
#
# Runs the test suite on every push and pull request.
#
# WHY THIS EXISTS NOW
# ===================
# There were 58 tests and nothing ran them except by hand. On 2026-09-04 a
# change shipped on 09-01 was found to have broken every TLE write for
# three days; the suite would not have caught that one (the test agreed
# with the bug), but it is the last time a regression should get three
# days of runway.
#
# THE SKIP PROBLEM
# ================
# Two test files skip themselves when their dependency is absent:
#
#   tests/test_taxonomy_validation.py  needs the WIT package
#   tests/test_writer_columns.py       needs 001_core_schema.sql, which
#                                      lives in the sibling
#                                      satellite-platform-infrastructure repo
#
# Skipping is right on a laptop with one repo checked out. In CI it would
# mean the schema-drift guard silently never runs while the job reports
# green - the exact shape of failure this project keeps hitting.
#
# So: CI checks out the infrastructure repo, points the test at it with
# SCHEMA_SQL_PATH, and sets REQUIRE_SCHEMA=1 so a missing schema fails
# instead of skipping. Both repos are public, so the default GITHUB_TOKEN
# is enough and no extra secret is needed.
#
# The WIT tests stay skipped in CI by design: WIT is a separate editable
# install and its database is a local artifact.
#
# COLLECTION SCOPE
# ================
# pytest.ini sets `testpaths = tests`. The repo root holds diagnostics
# that talk to the live database, and one of them used to be called
# test_writer_roundtrip.py - pytest collected it, the import failed
# without python-dotenv, and CI exited 2 with a collection error rather
# than a test failure. Renamed, and scoped here so it cannot recur.
#
# DEPENDENCIES: not requirements.txt. That file carries the geospatial
# stack (rasterio, geopandas, fiona, pyproj) for src/imagery/, which needs
# system GDAL. The tests need skyfield, sgp4, numpy, requests, sqlalchemy
# and psycopg2 only.
#
# python-dotenv is deliberately NOT installed, so CI exercises the path
# where src/env.py finds no dotenv and falls back to the environment -
# which is how the scheduled workflows actually run.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # 001_core_schema.sql lives here, and tests/test_writer_columns.py is
      # the only guard against writer.py drifting away from it. Public
      # repo, so the default token suffices.
      - name: Check out the schema (sibling infrastructure repo)
        uses: actions/checkout@v7
        with:
          repository: Satellite-Platforms-And-Analytics/satellite-platform-infrastructure
          path: _infrastructure
          sparse-checkout: schema

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "skyfield>=1.45" "sgp4>=2.22" "numpy>=1.24" \
                      "requests>=2.31" "sqlalchemy>=2.0.0" \
                      "psycopg2-binary>=2.9.0" pytest

      - name: Verify the schema is present
        # Fail here with a clear message rather than letting the guard
        # quietly skip three tests inside an otherwise green run.
        run: |
          test -f "_infrastructure/schema/001_core_schema.sql" || {
            echo "::error::001_core_schema.sql not checked out; the schema"\
                 "drift guard would silently skip."
            exit 1
          }

      - name: Run tests
        env:
          SCHEMA_SQL_PATH: ${{ github.workspace }}/_infrastructure/schema/001_core_schema.sql
          REQUIRE_SCHEMA: "1"
        run: pytest -q

      - name: Summary
        if: success()
        run: |
          echo "✅ Suite passed, including the schema drift guard against" \
               "001_core_schema.sql." >> "$GITHUB_STEP_SUMMARY"

# .github/workflows/ci.yml
#
# Runs the test suite on every push and pull request.
#
# WHY THIS EXISTS NOW
# ===================
# There were 58 tests and nothing ran them except by hand. On 2026-09-04 a
# change shipped on 09-01 was found to have broken every TLE write for
# three days; the suite would not have caught that one (the test agreed
# with the bug), but it is the last time a regression should get three
# days of runway.
#
# THE SKIP PROBLEM
# ================
# Two test files skip themselves when their dependency is absent:
#
#   tests/test_taxonomy_validation.py  needs the WIT package
#   tests/test_writer_columns.py       needs 001_core_schema.sql, which
#                                      lives in the sibling
#                                      satellite-platform-infrastructure repo
#
# Skipping is right on a laptop with one repo checked out. In CI it would
# mean the schema-drift guard silently never runs while the job reports
# green - the exact shape of failure this project keeps hitting.
#
# So: CI checks out the infrastructure repo, points the test at it with
# SCHEMA_SQL_PATH, and sets REQUIRE_SCHEMA=1 so a missing schema fails
# instead of skipping. Both repos are public, so the default GITHUB_TOKEN
# is enough and no extra secret is needed.
#
# The WIT tests stay skipped in CI by design: WIT is a separate editable
# install and its database is a local artifact.
#
# COLLECTION SCOPE
# ================
# pytest.ini sets `testpaths = tests`. The repo root holds diagnostics
# that talk to the live database, and one of them used to be called
# test_writer_roundtrip.py - pytest collected it, the import failed
# without python-dotenv, and CI exited 2 with a collection error rather
# than a test failure. Renamed, and scoped here so it cannot recur.
#
# DEPENDENCIES: not requirements.txt. That file carries the geospatial
# stack (rasterio, geopandas, fiona, pyproj) for src/imagery/, which needs
# system GDAL. The tests need skyfield, sgp4, numpy, requests, sqlalchemy
# and psycopg2 only.
#
# python-dotenv is deliberately NOT installed, so CI exercises the path
# where src/env.py finds no dotenv and falls back to the environment -
# which is how the scheduled workflows actually run.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # A dependency vulnerability appears without anyone touching this
  # repository. A scan that only runs on push can therefore never find
  # one: the disclosure is the event, and there is no commit attached to
  # it. Mondays, 07:11 UTC.
  schedule:
    - cron: "11 7 * * 1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# SECURITY: least privilege for GITHUB_TOKEN.
#
# Without a `permissions:` block a workflow inherits the repository
# default, which on many repositories is read/write on contents - so a job
# that only needs to read code runs holding a token that can push to the
# default branch. Declared explicitly here so the answer does not depend
# on a repository setting nobody re-checks. Added 2026-09-13.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # 001_core_schema.sql lives here, and tests/test_writer_columns.py is
      # the only guard against writer.py drifting away from it. Public
      # repo, so the default token suffices.
      - name: Check out the schema (sibling infrastructure repo)
        uses: actions/checkout@v7
        with:
          repository: Satellite-Platforms-And-Analytics/satellite-platform-infrastructure
          path: _infrastructure
          sparse-checkout: schema

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Verify the schema is present
        # Fail here with a clear message rather than letting the guard
        # quietly skip three tests inside an otherwise green run.
        run: |
          test -f "_infrastructure/schema/001_core_schema.sql" || {
            echo "::error::001_core_schema.sql not checked out; the schema"\
                 "drift guard would silently skip."
            exit 1
          }

      - name: Run tests
        env:
          SCHEMA_SQL_PATH: ${{ github.workspace }}/_infrastructure/schema/001_core_schema.sql
          REQUIRE_SCHEMA: "1"
        run: pytest -q

      - name: Summary
        if: success()
        run: |
          echo "✅ Suite passed, including the schema drift guard against" \
               "001_core_schema.sql." >> "$GITHUB_STEP_SUMMARY"

  # ── Dependency vulnerabilities ──────────────────────────────────────
  #
  # WHY THIS IS ITS OWN JOB AND WHY IT IS ALLOWED TO FAIL
  # =====================================================
  # The security baseline's rule is that a finding gets a check that can
  # go red, not a note. So this job fails when pip-audit reports a known
  # vulnerability -- the run goes red and is visible.
  #
  # It is deliberately a separate job from `test`, so a CVE disclosed
  # upstream, in something nobody here changed, makes the run red without
  # making the test result unreadable. The two answers "the code is
  # broken" and "a dependency has a new advisory" should not arrive as one
  # signal.
  #
  # It is honest about what it can and cannot see. Requirements are
  # declared as `>=` ranges with no lockfile (AD-064), so this audits
  # whatever pip resolves *today*. That is the same set the scheduled
  # pipelines install, which is the point -- but it also means a clean run
  # is a statement about this morning, not about what ran last week.
  # Locking and hashing is what turns that into a durable answer.
  #
  # rasterio is excluded: requirements-imagery.txt needs GDAL, no
  # scheduled job installs it, and making the security scan depend on a
  # native build is how a security scan ends up permanently skipped.
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit

      - name: Audit declared dependencies
        run: |
          pip-audit --progress-spinner off \
            -r requirements.txt \
            -r requirements-dev.txt \
            -r requirements-archive.txt \
            -r requirements-tracking.txt

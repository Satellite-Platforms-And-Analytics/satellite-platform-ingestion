# .github/workflows/ingest_tle.yml
#
# Runs src/tle/fetcher.py on a schedule to keep the satellites and
# tle_history tables current in Supabase.
#
# SCHEDULE: every 2 hours at :37, matching CELESTRAK_CACHE_MAX_AGE_HOURS
# in src/tracking/config.py -- CelesTrak itself only refreshes GP data
# every 2 hours, so running more often just gets throttle notices back
# (which fetcher.py already handles gracefully, but there is no upside to
# tripping them on a schedule).
#
#   Why :37 and not :00. Observed 2026-08-31: this workflow was landing
#   8-12 hours apart on a "0 */2" schedule. Scheduled jobs on shared
#   runners are best-effort and the top of the hour is when everyone
#   else's queue lands, so runs there are likeliest to be delayed or
#   dropped. propagate.yml uses :17 and ingest_visibility.yml uses :43
#   for the same reason; :37 keeps all three apart.
#
#   This matters more since 2026-09-01 than it did before: this job now
#   owns tle_history retention via --prune-history. A skipped run is no
#   longer just stale TLEs, it is a table that keeps growing.
#
# DEPENDENCIES: intentionally NOT `pip install -r requirements.txt`
# (the root one). That file includes the full geospatial/imagery stack
# (rasterio, geopandas, fiona, pyproj) for src/imagery/ingest.py, which
# needs system GDAL libraries and is slow to install -- unnecessary
# weight for a job that only runs fetcher.py. Installing the specific
# packages fetcher.py + writer.py actually import keeps this job fast
# and avoids an unrelated native-dependency failure mode breaking TLE
# ingestion. If fetcher.py's imports change, update the list below.
#
# REQUIRED SECRET:
#   DATABASE_URL  -- Supabase Postgres connection string. Use the
#                     POOLED connection string (port 6543), not the
#                     direct one (port 5432) -- this job is a short-lived
#                     process and the pooled endpoint is what Supabase
#                     recommends for that usage pattern.
#
# Set it at: repo Settings -> Secrets and variables -> Actions -> New
# repository secret -> DATABASE_URL

name: Ingest TLE Data

on:
  schedule:
    # Every 2 hours at :37. GitHub Actions cron is UTC. See the note on
    # delivery reliability at the top of this file.
    - cron: "37 */2 * * *"
  workflow_dispatch:
    inputs:
      group:
        description: >
          Optional: fetch a single CelesTrak group only (e.g. "starlink").
          Leave blank to fetch all groups (same as the scheduled run).
        required: false
        default: ""
      dry_run:
        description: "Fetch and parse only -- skip the database write"
        required: false
        default: false
        type: boolean

# Prevent two runs from writing to the database at the same time if a
# manual trigger overlaps with the scheduled run.
concurrency:
  group: ingest-tle
  cancel-in-progress: false

# RETENTION: --prune-history keeps 14 days of tle_history.
#
#   Measured 2026-09-01: 1,574,305 rows, 515 MB - 86% of a 597 MB
#   database against a 500 MB tier, with nothing bounding it while
#   orbital_positions and visibility_windows both had retention. The rows
#   are legitimate (1-3 new element sets per satellite per day, real
#   CelesTrak churn), so this is a budget limit, not a bug fix.
#
#   14 days holds ~113 MB. Widen it when the tier allows.
#
#   A DELETE does not return space to the filesystem and Supabase bills
#   on the file, so the first reclaim needs the VACUUM FULL in
#   cleanup_tle_history.py. After that this step keeps it flat.

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install fetcher.py + writer.py dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests sgp4>=2.22 sqlalchemy>=2.0.0 psycopg2-binary>=2.9.0

      - name: Run fetcher.py (dry run)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
        run: |
          python -m src.tle.fetcher --dry-run ${{ inputs.group != '' && format('--group {0}', inputs.group) || '' }}

      - name: Run fetcher.py (write to database)
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run == true) }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -m src.tle.fetcher --prune-history ${{ github.event_name == 'workflow_dispatch' && inputs.group != '' && format('--group {0}', inputs.group) || '' }}

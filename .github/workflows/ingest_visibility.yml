# .github/workflows/ingest_visibility.yml
#
# Computes which satellites each ground sensor can see, hour by hour, and
# writes them to visibility_windows. Then prunes anything older than the
# retention window.
#
# SCHEDULE: daily, 06:43 UTC.
#
#   Daily, not hourly: a window is a property of a whole UTC day at 1-hour
#   binning, so recomputing it more than once a day rewrites the same
#   (norad_id, sensor_id, window_start) keys with near-identical numbers.
#   The upsert makes a re-run harmless, not useful.
#
#   :43 and not :00 - the same reasoning as propagate.yml. GitHub's own
#   guidance is that scheduled jobs at the top of the hour compete with
#   everyone else's and are likelier to be delayed or dropped.
#
#   06:43 UTC leaves ~17 hours of the analysis day still ahead, so most of
#   what lands is forward-looking rather than a record of passes already
#   missed.
#
# TIMEOUT: 20 minutes, from measurement rather than guesswork.
#
#   Measured 2026-09-01 against the live 18,044-object catalogue:
#
#     FPS85        43,621 windows   10.6 s
#     GEODSS_SOC   75,084 windows    8.0 s
#     MILLSTONE   103,083 windows    8.2 s
#     total       221,788 windows   26.8 s compute
#
#   The first full write then measured 71 s end to end - the batched
#   writer moved 221,788 rows at ~5,100 rows/sec, well above the
#   1,396 rows/sec seen on orbital_positions. 20 minutes is therefore
#   ~17x headroom rather than the 3x first estimated. Left wide on
#   purpose: a shared runner is not this machine, and the cost of an
#   over-generous timeout is nothing while the cost of a tight one is a
#   silent kill.
#
#   This number matters more than it looks. When ingest_tle.yml exceeded
#   its timeout the process was killed outright - no exception, so no
#   `failed` row was ever written, and ten silent no-op runs went unnoticed
#   from 2026-08-26 to 08-31. A timeout that fires is invisible. The only
#   defence is setting it from a measured runtime.
#
# RETENTION: 3 days.
#
#   221,788 rows a day at a measured 215 bytes each is 47.7 MB daily, and
#   unlike orbital_positions nothing self-limits: the upsert key includes
#   window_start, so re-running a day updates in place but each new day
#   accumulates.
#
#   This was 7 days when the estimate was 180 bytes/row. Measured on the
#   first real run it was 215, and the database turned out to be at
#   597 MB against a 500 MB tier already - tle_history holding 515 MB of
#   it. Seven days here is 334 MB; three is 143 MB, which fits alongside
#   a pruned tle_history at 113 MB.
#
#   Widen it when the budget allows. Coverage statistics want more than
#   three days; the tier is the only reason they do not get them.
#
# --all-sensors, not a job matrix: the catalogue is the same 18,000 rows
# whichever site is looking at it. One process loads it once and reuses it
# for all three sensors; a matrix would be three checkouts, three
# installs, and three identical 18,000-row queries.
#
# DEPENDENCIES: not `pip install -r requirements.txt`, for the same reason
# as the other two workflows - that file carries the geospatial stack
# (rasterio, geopandas, fiona, pyproj) for src/imagery/, which needs
# system GDAL and can fail the build. This job needs skyfield, because it
# must match the interactive tool's numbers exactly, plus requests and
# numpy which src/tracking/satellite_utils.py imports at module scope.
#
# REQUIRED SECRET:
#   DATABASE_URL -- Supabase Postgres, POOLED connection string (port 6543).

name: Ingest Visibility Windows

on:
  schedule:
    - cron: "43 6 * * *"
  workflow_dispatch:
    inputs:
      sensor:
        description: "One sensor short_name (blank = all sensors)"
        required: false
        default: ""
      date:
        description: "Analysis date YYYY-MM-DD (blank = today UTC)"
        required: false
        default: ""
      limit:
        description: "Only this many satellites (blank = all)"
        required: false
        default: ""
      dry_run:
        description: "Compute and report, but do not write"
        required: false
        default: false
        type: boolean
      skip_prune:
        description: "Do not delete windows older than the retention window"
        required: false
        default: false
        type: boolean

# One writer at a time. A manual run overlapping the schedule would other-
# wise have two processes upserting the same
# (norad_id, sensor_id, window_start) keys.
concurrency:
  group: ingest-visibility
  cancel-in-progress: false

jobs:
  visibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install visibility dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "skyfield>=1.45" "sgp4>=2.22" "numpy>=1.24" \
                      "requests>=2.31" "sqlalchemy>=2.0.0" \
                      "psycopg2-binary>=2.9.0"

      - name: Compute and write visibility windows
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -m src.visibility \
            ${{ inputs.sensor != '' && format('--sensor {0}', inputs.sensor) || '--all-sensors' }} \
            ${{ inputs.date != '' && format('--date {0}', inputs.date) || '' }} \
            ${{ inputs.limit != '' && format('--limit {0}', inputs.limit) || '' }} \
            ${{ inputs.dry_run == true && '--dry-run' || '' }} \
            ${{ !(inputs.dry_run == true) && !(inputs.skip_prune == true) && '--prune' || '' }}

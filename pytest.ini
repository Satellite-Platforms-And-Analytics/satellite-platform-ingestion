[pytest]
# Collect only from tests/.
#
# The repo root holds operational diagnostics - check_pipeline.py,
# check_write_speed.py, check_writer_roundtrip.py, verify_paths.py,
# cleanup_tle_history.py. They connect to the live database and are meant
# to be run by hand.
#
# One of them was called test_writer_roundtrip.py, which matches pytest's
# default discovery pattern. Locally that was invisible: the import
# succeeded and the module contributed no tests. In CI, where
# python-dotenv is deliberately not installed, importing it raised
# ModuleNotFoundError during collection and pytest exited 2 - a collection
# error, not a test failure, so the report said nothing about which test
# was wrong. It has been renamed to check_writer_roundtrip.py; this keeps
# the next one from doing the same thing.
testpaths = tests

# Put the repo root on sys.path so `from src...` resolves.
#
# Without this, whether the suite runs at all depends on how pytest was
# invoked: `python -m pytest` puts the working directory on sys.path and
# everything imports, while the bare `pytest` console script does not and
# collection dies with ModuleNotFoundError: No module named 'src'. Local
# runs passed and CI exited 2 on the same commit for exactly that reason.
#
# There is no conftest.py to do it implicitly, and adding one just to
# manipulate sys.path is more machinery than this needs.
pythonpath = .

# Show why anything was skipped. Skips are how a guard silently stops
# guarding, and this project has been bitten by that shape repeatedly.
addopts = -ra
